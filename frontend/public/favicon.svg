<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Pitch Black Outer Canvas -->
  <rect width="64" height="64" rx="6" fill="#080808" />
  
  <!-- Outer 1px Tactical Border -->
  <rect x="1" y="1" width="62" height="62" rx="5" fill="none" stroke="#222222" stroke-width="1.5" />

  <!-- Main Volt Lime Emblem Block -->
  <rect x="7" y="7" width="50" height="50" rx="3" fill="#CCFF00" />

  <!-- Top-Right Cyber Pink Classified Corner Cut -->
  <path d="M 41 7 L 57 7 L 57 23 Z" fill="#FF0055" />
  <line x1="41" y1="7" x2="57" y2="23" stroke="#080808" stroke-width="2" />

  <!-- High-Impact Brand Letters "AB" -->
